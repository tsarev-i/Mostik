# "Report a bug" in Mostik's profile menu opens this form (bug-en.yml in the English UI) with
# `version` and `system` filled in from the link (app/src-tauri/src/backend/report.rs). Copies
# already installed keep that link: keep the file names, those two ids and their labels.
name: Ошибка
description: Что-то в Мостике работает не так
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Отчёт будет публичным. Не добавляйте переписку, имена коллег и другие личные данные.
  - type: textarea
    id: what
    attributes:
      label: Описание
      placeholder: Что произошло? Как повторить ошибку? Что вы ожидали?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Мостика
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Система
    validations:
      required: true
