# dev and pull requests: build and tests on Linux.
# main: the same, then bundles in parallel (AppImage for Linux, NSIS setup for Windows, an Apple
# Silicon .app and DMG for macOS), each after the tests on its platform, and a GitHub release
# tagged vX.Y.Z with the bundles attached.
#
# macOS bundles are signed ad hoc (signingIdentity "-" in tauri.conf.json), without an Apple
# Developer ID: Gatekeeper asks the user to allow the first launch.
#
# Auto-update: with the TAURI_SIGNING_PRIVATE_KEY secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# if the key has one) the bundles are signed, and the release gets latest.json, which installed
# copies check through the updater endpoint in tauri.conf.json. A release requires the key.
#
# Release version: X.Y comes from `[workspace.package] version` in Cargo.toml, Z is one more
# than the latest vX.Y.* tag (or the patch from Cargo.toml if that is higher). To start a new
# minor or major line, bump the version in Cargo.toml.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# Runs on main wait for each other instead of being cancelled: each one publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAURI_CLI_VERSION: 2.12.4

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.versions.outputs.rust }}
      wasm-bindgen: ${{ steps.versions.outputs.wasm-bindgen }}
      version: ${{ steps.versions.outputs.version }}
      release: ${{ steps.versions.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      # The toolchain is the declared MSRV, and the wasm-bindgen CLI must match the crate exactly.
      - name: Read versions
        id: versions
        env:
          RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          base=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          version=$base
          if [ "$RELEASE" = true ]; then
            prefix="v${base%.*}."
            last=$(git ls-remote --tags --refs origin \
              | awk -v p="refs/tags/$prefix" 'index($2, p) == 1 { s = substr($2, length(p) + 1); if (s ~ /^[0-9]+$/) print s }' \
              | sort -n | tail -1)
            patch=${base##*.}
            if [ -n "$last" ] && [ $((last + 1)) -gt "$patch" ]; then
              patch=$((last + 1))
            fi
            version="${base%.*}.$patch"
          fi
          {
            echo "rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
            echo "wasm-bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
            echo "version=$version"
            echo "release=$RELEASE"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.version.outputs.rust }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ needs.version.outputs.wasm-bindgen }}

      - name: Check formatting
        run: cargo fmt --all --check

      # The desktop shell embeds app/ui/dist at compile time, so the UI goes first.
      - name: Build UI (wasm)
        run: bash scripts/ui.sh build

      - name: Clippy (UI, wasm)
        run: cargo clippy --locked -p mostik-ui --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: [version, test]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu image: its glibc 2.35 lets the AppImage run on older distributions.
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-2025
          # Apple Silicon only, no Intel build. The .app is what the updater installs,
          # the DMG is for the first install; appimage and nsis from tauri.conf.json do not apply here.
          - platform: macos
            os: macos-15
            rust-targets: aarch64-apple-darwin
            build-args: --target aarch64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The AppImage bundles the tray library found here: Ayatana, the one current distributions ship.
      # ALSA plays the notification sounds; the AppImage uses the system's libasound.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.version.outputs.rust }}
          targets: wasm32-unknown-unknown${{ matrix.rust-targets && format(',{0}', matrix.rust-targets) || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ needs.version.outputs.wasm-bindgen }},tauri-cli@${{ env.TAURI_CLI_VERSION }}

      # Tauri takes the bundle version from Cargo.toml. `-i.bak`: BSD sed on macOS needs a suffix.
      - name: Set version ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i.bak "/^\[workspace\.package\]/,/^\[/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak

      - name: Build UI (wasm)
        run: bash scripts/ui.sh build --release

      # The Windows and macOS code (password store, call window, menus) is tested here only:
      # the Test job runs on Linux. Not `--locked`: setting the version has changed Cargo.toml.
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-features

      # The UI is already built: on Windows the hook's `bash` could resolve to WSL instead of Git Bash.
      # The signing key gives the bundles .sig files for the updater.
      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: a release without signed bundles breaks auto-update"
            exit 1
          fi
          cargo tauri build --ci ${{ matrix.build-args }} \
            --config '{"build":{"beforeBuildCommand":null},"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect bundles
        run: |
          shopt -s nullglob
          mkdir -p dist
          cp target/{,*/}release/bundle/*/*.{AppImage,exe,app.tar.gz}{,.sig} target/{,*/}release/bundle/*/*.dmg dist/
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: mostik-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Runs even when a bundle job failed: GitHub sometimes finds no macOS runner for hours, and Linux
  # and Windows should not wait for it. Re-running the failed bundle job later runs this job again,
  # which adds the missing bundle to the same release and rewrites latest.json.
  release:
    name: Release
    needs: [version, bundle]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.bundle.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mostik-*
          path: dist
          merge-multiple: true

      # The updater manifest: installed copies fetch it from the latest release and verify the
      # downloaded bundle against its signature. A platform whose bundle is missing is left out:
      # its copies keep their version until the bundle is added. Linux and Windows are required.
      - name: Write latest.json
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          ls -l dist
          # The workflow log: stdout of platform() is the manifest.
          exec 3>&1
          platform() {
            local files=(dist/$2)
            if [ ${#files[@]} -eq 0 ]; then
              if [ "$3" = required ]; then
                echo "::error::No $2 bundle for $1" >&3
                exit 1
              fi
              echo "::warning::No $2 bundle for $1: this release goes out without it; re-run the failed bundle job to add it" >&3
              return
            fi
            local file=${files[0]#dist/}
            jq -n --arg key "$1" --arg url "https://github.com/$GH_REPO/releases/download/v$VERSION/$file" \
              --arg sig "$(cat "dist/$file.sig")" '{($key): {signature: $sig, url: $url}}'
          }
          {
            platform linux-x86_64 '*.AppImage' required
            platform windows-x86_64 '*-setup.exe' required
            platform darwin-aarch64 '*.app.tar.gz'
          } > platforms.json
          jq -s --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, platforms: add}' platforms.json > latest.json
          cat latest.json

      # A re-run finds the release already published: it uploads only the bundles the release
      # lacks and replaces latest.json, so files people may be downloading stay untouched.
      - name: Publish v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.exe dist/*.dmg dist/*.app.tar.gz)
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" "${files[@]}" latest.json \
              --target "$GITHUB_SHA" --title "Mostik v$VERSION" --generate-notes
            exit 0
          fi
          present=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          missing=()
          for file in "${files[@]}"; do
            grep -qxF "${file#dist/}" <<< "$present" || missing+=("$file")
          done
          echo "Adding to v$VERSION: ${missing[*]:-nothing}"
          gh release upload "v$VERSION" "${missing[@]}" latest.json --clobber
