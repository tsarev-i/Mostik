[package]
name = "mostik-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Mostik user interface (Leptos, wasm)"

[dependencies]
mostik-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlTextAreaElement", "HtmlInputElement", "KeyboardEvent", "MouseEvent", "Selection", "HtmlElement", "Element", "Document", "Navigator", "Clipboard", "Window", "Storage", "PointerEvent", "MediaQueryList", "HtmlSelectElement", "DomRect", "ScrollIntoViewOptions", "ScrollLogicalPosition", "NodeList", "Node"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
emojis = "0.9.1"
