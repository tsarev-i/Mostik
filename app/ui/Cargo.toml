[package]
name = "mostik-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Mostik user interface (Leptos, wasm)"

[features]
# The demo data the UI shows in a plain browser (`scripts/ui.sh serve`); the app's UI goes without it.
demo = ["mostik-core/mock"]

[dependencies]
mostik-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlInputElement", "KeyboardEvent", "MouseEvent", "Selection", "HtmlElement", "Element", "Document", "Navigator", "Clipboard", "Window", "Storage", "MediaQueryList", "DomRect", "ScrollIntoViewOptions", "ScrollLogicalPosition", "NodeList", "Node", "Range", "DocumentFragment", "Text", "DomTokenList", "ClipboardEvent", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "InputEvent", "StaticRange", "AbstractRange", "EventInit"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
serde.workspace = true
serde_json.workspace = true
emojis.workspace = true

[dev-dependencies]
mostik-core = { workspace = true, features = ["mock"] }
