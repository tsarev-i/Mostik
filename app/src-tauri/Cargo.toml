[package]
name = "mostik-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Mostik desktop shell (Tauri 2)"
default-run = "mostik"

[[bin]]
name = "mostik"
path = "src/main.rs"

# Live write self-test for development, kept out of the release bundles.
# No tests of its own: the store.rs tests it includes already run with the main binary.
[[bin]]
name = "mostik-selftest"
path = "src/bin/selftest.rs"
required-features = ["selftest"]
test = false

[features]
selftest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
imagesize = "0.13"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native"] }
mime_guess = "2"
mostik-core.workspace = true
mostik-yandex.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# No TLS feature of its own: its `rustls-tls` adds the ring provider next to reqwest's aws-lc-rs,
# and rustls then panics without a process default. reqwest is shared with mostik-yandex, so the
# updater uses the same rustls setup.
tauri-plugin-updater = { version = "2", default-features = false, features = ["system-proxy"] }
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Close-on-exec flags before the restart after an update.
libc = "0.2"
# Same version as wry uses: needed to customise the WebKitGTK context menu.
webkit2gtk = "=2.0.2"
