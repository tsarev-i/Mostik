[package]
name = "mostik-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Mostik desktop shell (Tauri 2)"
default-run = "mostik"

[[bin]]
name = "mostik"
path = "src/main.rs"

# Live write self-test for development, kept out of the release bundles. It shares the session
# store with the app through the library (src/lib.rs).
[[bin]]
name = "mostik-selftest"
path = "src/bin/selftest.rs"
required-features = ["selftest"]
test = false

[features]
selftest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pasted files are shared, not copied, between the memory they are kept in and the upload.
bytes = "1"
futures-util = "0.3"
imagesize = "0.13"
# Custom emoji: still images are scaled down to 128 px and posted as PNG; a GIF goes as is, undecoded.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
mime_guess = "2"
mostik-core.workspace = true
mostik-yandex.workspace = true
# Notification sounds, played here rather than in the webview: WebKitGTK plays audio through
# GStreamer, which the AppImage does not carry, and may hold back audio of a hidden window.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# No TLS feature of its own: its `rustls-tls` adds the ring provider next to reqwest's aws-lc-rs,
# and rustls then panics without a process default. reqwest is shared with mostik-yandex, so the
# updater uses the same rustls setup.
tauri-plugin-updater = { version = "2", default-features = false, features = ["system-proxy"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Session cookies of the call window straight into WebView2 (see call.rs). Same versions as wry uses.
webview2-com = "0.39"
windows-core = "0.62"
# ShellExecuteW for links and saved files: `cmd /C start` would parse `&` in a link as a command separator.
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# fd setup for the DevTools pipe of the call browser; close-on-exec flags before the restart after an update.
libc = "0.2"
# Same version as wry uses: needed to customise the WebKitGTK context menu.
webkit2gtk = "=2.0.2"
