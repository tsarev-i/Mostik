[package]
name = "mostik-yandex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Unofficial client for the internal protocol of the Telemost web client"

[dependencies]
mostik-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rmpv = "1"
bytes = "1"
reqwest = { version = "0.13", features = ["multipart"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
